<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="GIF গ্যালারিসহ আধুনিক ডার্ক স্ট্রিমিং ল্যান্ডিং পেজ"
  >

  <title>StreamBox — GIF Streaming</title>

  <style>
    /* =========================
       প্রধান রং ও সেটিংস
    ========================== */

    :root {
      --primary: #ff174f;
      --primary-dark: #d9003d;
      --background: #07070b;
      --panel: #111117;
      --panel-light: #1a1a22;
      --border: #2a2a34;
      --text: #ffffff;
      --muted: #a0a0ad;
      --green: #26d980;
      --radius: 14px;
      --page-width: 1250px;
    }

    /* =========================
       সাধারণ CSS
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 15%,
          rgba(255, 23, 79, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 75%,
          rgba(93, 40, 255, 0.1),
          transparent 25%
        ),
        var(--background);

      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
    }

    body.menu-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(var(--page-width), calc(100% - 32px));
      margin: 0 auto;
    }

    /* =========================
       হেডার
    ========================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 0;

      background: rgba(7, 7, 11, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(15px);
    }

    .navbar {
      min-height: 60px;
      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      background: rgba(17, 17, 23, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      color: white;
      background: var(--primary);
      border-radius: 9px;
      box-shadow: 0 7px 22px rgba(255, 23, 79, 0.35);
    }

    .logo-text {
      font-size: 21px;
      font-weight: 800;
    }

    .logo-badge {
      padding: 3px 6px;

      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 4px;

      font-size: 8px;
      font-weight: 800;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .navigation a {
      padding: 9px 12px;

      color: var(--muted);
      border-radius: 8px;

      font-size: 13px;
      text-decoration: none;
      transition: 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      color: white;
      background: var(--panel-light);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      color: white;
      background: var(--panel-light);
      border: 1px solid var(--border)
</style>
</head>
